name: Publish

on:
  workflow_call:
    inputs:
      vpu_docker_registry:
        required: true
        type: string
      vpu_docker_image_name:
        required: true
        type: string
      vpu_docker_repositories:
        required: true
        type: string
      pypi_deploy_repo:
        required: true
        type: string
      build_name:
        required: true
        type: string
      build_number:
        required: true
        type: string

jobs:
  publish-docker:
    runs-on: ubuntu-latest
    env:
      VPU_DOCKER_REGISTRY: ${{ inputs.vpu_docker_registry }}
      VPU_DOCKER_IMAGE_NAME: ${{ inputs.vpu_docker_image_name }}
      VPU_DOCKER_REPOSITORIES: ${{ inputs.vpu_docker_repositories }}
      COLUMNS: 160
      JFROG_CLI_BUILD_NAME: ${{ inputs.build_name }}
      JFROG_CLI_BUILD_NUMBER: ${{ inputs.build_number }}
      JFROG_CLI_TEMP_DIR: ${{ github.workspace }}/.jfrog-build"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-jfrog

      - name: Add Git info to build
        run: jf rt build-add-git

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install VPU
        # Installs the `ci` dependency group at the versions pinned in `uv.lock`.
        # `--only-group` omits the project and its runtime dependencies, which VPU
        # does not need.
        run: uv sync --locked --only-group ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: docker-images

      - name: Load docker images
        run: docker load -i docker-images.tar

      - name: Publish Docker Image(s)
        run: uv run --no-sync vpu docker push

      - name: Upload build info partials
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-partials-${{ github.job }}
          path: ${{ env.JFROG_CLI_TEMP_DIR }}
          include-hidden-files: true
          if-no-files-found: error

  publish-build-info:
    needs:
      - publish-docker
    runs-on: ubuntu-latest
    env:
      JFROG_CLI_BUILD_NAME: ${{ inputs.build_name }}
      JFROG_CLI_BUILD_NUMBER:  ${{ inputs.build_number }}
      JFROG_CLI_TEMP_DIR: ${{ github.workspace }}/.jfrog-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-jfrog

      - name: Add environment and git information to build info
        run: |
          jf rt build-collect-env
          jf rt build-add-git

      - name: Download build info partials
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: build-partials-*
          path: ${{ env.JFROG_CLI_TEMP_DIR }}
          merge-multiple: true

      - name: Publish unified build info
        run: jf rt build-publish

  # The Pages artifact is built and uploaded by `build.yml`, which is where the site knows
  # the URL it is served from. Nothing is left to do here but deploy that artifact.
  publish-docs:
    runs-on: ubuntu-latest
    needs:
      - publish-docker
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
