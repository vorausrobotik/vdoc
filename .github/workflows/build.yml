name: Build

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

jobs:
  build-python:
    runs-on: ubuntu-latest
    env:
      COLUMNS: 160
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Sync project
        # `--locked` asserts that `uv.lock` matches `pyproject.toml` and never re-resolves.
        # The guarantee is local to this step, so it holds regardless of which jobs ran before.
        run: uv sync --locked

      - name: Install npm dependencies
        run: npm ci

      - name: Build UI
        run: npm run build
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Build python app
        run: uv run tox run -e build

      - name: Upload rollup visualizer result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rollup-visualizer
          path: reports/bundle-report.html

      - name: Upload python artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/*

  # Separate from `build-python` because the documentation is its own npm project and needs
  # to know the address GitHub Pages serves it from, which nothing else in the build does.
  build-docs:
    runs-on: ubuntu-latest
    env:
      COLUMNS: 160
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Sync project
        # The license compliance page is generated from what is installed, so the docs build
        # needs the project and its dependencies before it can run.
        run: uv sync --locked

      # Asks GitHub where this repository's Pages site lives, so the build is stamped with the
      # address it will actually be served from - a fork publishes under its own account, and a
      # custom domain would be picked up without editing anything. Deliberately not fatal: a
      # repository with Pages disabled still gets a documentation build, from the fallbacks in
      # `docs/docusaurus.config.ts`.
      - name: Resolve the Pages URL
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build docs
        run: uv run tox run -e docs
        env:
          # Empty when the step above did not run or found no Pages site, which is why the
          # config falls back on falsy rather than on undefined.
          DOCS_URL: ${{ steps.pages.outputs.origin }}
          DOCS_BASE_URL: ${{ steps.pages.outputs.base_path && format('{0}/', steps.pages.outputs.base_path) || '' }}

      # Uploaded in the shape `actions/deploy-pages` expects, so the publish workflow only has
      # to deploy it.
      - name: Upload docs
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/build

  # Checks that the image builds from the wheel above. The release pipeline builds and pushes it
  # again with `vpu`, which needs the Artifactory credentials only a tag build gets.
  build-docker:
    needs:
      - build-python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download python artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Build Docker image
        run: docker build --target wheel .
