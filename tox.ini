[tox]
envlist =
    lint
    {py311,py312,py313,py314}-test
    combine-test-reports
isolated_build = True

[gh-actions]
python =
    3.11: py311-test
    3.12: py312-test
    3.13: py313-test
    3.14: py314-test

[testenv]
# Install dependencies with `uv sync --locked` instead of `uv pip install`, so every tox
# environment gets the exact versions from `uv.lock` rather than a fresh PyPI resolution
# of the ranges in `pyproject.toml`. A stale lockfile fails the run instead of drifting.
runner = uv-venv-lock-runner

# Passes host environment variables to the tox environment.
passenv =
    CI
    PROJECT
    MATURITY
    SCOPE
    LOCATION
    UV_INDEX
    JFROG_CLI_*
    CODEMETER_HOST
    SOURCE_DATE_EPOCH
    JENKINS_URL
    TAG_NAME
    BUILD_NUMBER
    BRANCH_NAME
    CHANGE_TARGET
    VPU_*
# Define additional environment variables for all test environments.
setenv =
    VPU_DOCKER_IMAGE_NAME = {env:PACKAGE_NAME}
    VPU_DOCKER_REPOSITORIES = {env:PROJECT}-docker-{env:SCOPE}-{env:MATURITY}-{env:LOCATION}-local
# Allow those external commands in all test environments
allowlist_externals =
    jf

# Install the project non-editable, so coverage keeps resolving it via site-packages
# (see [tool.coverage.paths] in pyproject.toml). Maps to `uv sync --no-editable`.
package = wheel


[testenv:lint]
description = Run static checkers.
basepython = py311
setenv =
    {[testenv]setenv}
    DOCSDIR = {toxinidir}/docs
dependency_groups = lint
commands =
    # Check for common spelling mistakes
    codespell --builtin clear,en-GB_to_en-US
    # Check type hinting
    mypy .
    # Check formatting
    ruff format --check .
    # Lint source code
    ruff check .


[testenv:{py311,py312,py313,py314}-test]
description = Run doc tests and unit tests.
package = wheel
dependency_groups = test
setenv =
    {[testenv]setenv}
    PY_IGNORE_IMPORTMISMATCH=1
    COVERAGE_FILE = reports{/}.coverage.{envname}
commands =
    # Run tests and doctests from .py files
    pytest --junitxml=reports/pytest.xml.{envname} {posargs} src/ tests/


[testenv:combine-test-reports]
description = Combine test and coverage data from multiple test runs.
package = skip
setenv =
    {[testenv]setenv}
    COVERAGE_FILE = reports/.coverage
depends = {py311,py312,py313,py314}-test
dependency_groups = coverage
commands =
    junitparser merge --glob reports/pytest.xml.* reports/pytest.xml
    coverage combine --keep
    coverage html
    coverage xml


[testenv:docs]
description = Build the docs.
# The site is a Docusaurus project under `docs/`, but the license page is generated from
# what is installed, so this environment still needs the package and its dependencies.
setenv =
    {[testenv]setenv}
    DOCSDIR = {toxinidir}/docs
# The address the site is built for. CI reads it from the GitHub Pages settings; locally both
# are unset and `docusaurus.config.ts` falls back to what this repository publishes as.
passenv =
    {[testenv]passenv}
    DOCS_URL
    DOCS_BASE_URL
dependency_groups = doc
allowlist_externals =
    npm
commands =
    # Dump OSS license information into the docs directory
    python {env:DOCSDIR}/_scripts/generate_license_information.py
    # Drop the bundler cache before `npm ci` deletes the tree it sits in. Docusaurus Faster
    # writes it to `node_modules/.cache/rspack`, and a previous build still flushing it there
    # makes npm's own removal fail with ENOTEMPTY. On a fresh checkout there is nothing to do.
    python -c 'import shutil; shutil.rmtree("{env:DOCSDIR}/node_modules/.cache", ignore_errors=True)'
    # Install the documentation site's dependencies at the versions in its lockfile
    npm --prefix {env:DOCSDIR} ci
    # Build the docs. Broken links and broken markdown fail the build.
    npm --prefix {env:DOCSDIR} run build {posargs}

[testenv:build-ui]
description = Build the web UI.
package = skip  # Purely an npm build, the Python package is not needed here.
allowlist_externals =
    npm
commands =
    npm run build

[testenv:build]
description = Build the package.
dependency_groups =
    build
depends =
    build-ui
    docs

setenv =
    {[testenv]setenv}
commands =
    # Clean up build directories
    python -c 'from shutil import rmtree; rmtree("build", True); rmtree("dist", True)'
    # Build the package
    python -m build .

[testenv:build-docker]
description = Build the Docker image.
dependency_groups = ci
setenv =
    {[testenv]setenv}
commands =
    vpu docker build -f Dockerfile.prod


[testenv:publish]
description = Upload the package and the docker image(s)
dependency_groups = ci
setenv =
    {[testenv]setenv}
commands =
    vpu docker push
    jf twine --module='vdoc' upload dist/*
